# Fork-only workflow: publishes the patched paimon-flink-2.2 bundle and
# paimon-iceberg (plus their reactor dependencies) to this fork's GitHub
# Packages Maven registry. Trigger manually from the Actions tab.
name: Publish to GitHub Packages

on:
  workflow_dispatch:

env:
  MAVEN_OPTS: -Dmaven.wagon.httpconnectionManager.ttlSeconds=30 -Dmaven.wagon.http.retryHandler.requestSentEnabled=true

jobs:
  publish:
    if: github.repository != 'apache/paimon'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      # JDK 17: Iceberg 1.11 ships Java-17 class files (major 61), which a
      # JDK 11 javac cannot read when compiling paimon-iceberg. The flink2
      # profile's target.java.version=11 still emits 11-compatible bytecode
      # for the paimon modules; the paimon-iceberg profile is passed
      # explicitly below.
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: 'temurin'
      - name: Cache local Maven repository
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: gh-packages-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            gh-packages-maven-
      - name: Publish to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAVEN_OPTS: -Xmx4096m
        run: |
          tmp_settings="tmp-settings.xml"
          echo "<settings><servers><server>" > $tmp_settings
          echo "<id>github</id><username>${GITHUB_ACTOR}</username>" >> $tmp_settings
          echo "<password>${GITHUB_TOKEN}</password>" >> $tmp_settings
          echo "</server></servers></settings>" >> $tmp_settings

          # Fresh version: publish the full closure (flink-2.2 bundle, iceberg,
          # s3) in one pass. GitHub Packages only rejects re-uploads of an
          # existing version, so a new version can deploy everything at once.
          mvn --settings $tmp_settings -ntp clean deploy \
            -DskipTests -Dgpg.skip -Drat.skip \
            -Dflink2 -Ppaimon-iceberg \
            -pl paimon-flink/paimon-flink-2.2,paimon-iceberg,paimon-filesystems/paimon-s3 -am

          rm $tmp_settings
